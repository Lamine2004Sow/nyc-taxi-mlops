name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_LOCAL: nyc-taxi-mlops:ci

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python "${PYTHON_VERSION}"
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python "${PYTHON_VERSION}"
      - run: uv run pytest --cov=nyc_taxi --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  model-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python "${PYTHON_VERSION}"
      - name: Train on the fixture and gate against the baseline
        run: uv run python -m nyc_taxi evaluate-ci --fixture tests/fixtures/sample.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: champion-model
          path: models/champion/
          if-no-files-found: error

  docker:
    needs: [lint, test, model-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: champion-model
          path: models/champion
      - uses: docker/setup-buildx-action@v3
      # Build once: the image is exported as a tar and reused by the kind-smoke job.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE_LOCAL }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: nyc-taxi-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error
      - name: Compute lowercase GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push sha and latest tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker load --input "${RUNNER_TEMP}/image.tar"
          docker tag "${IMAGE_LOCAL}" "${GHCR_IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE_LOCAL}" "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${GITHUB_SHA}"
          docker push "${GHCR_IMAGE}:latest"

  kind-smoke:
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nyc-taxi-image
          path: ${{ runner.temp }}/image
      - name: Load image into the Docker daemon
        run: docker load --input "${RUNNER_TEMP}/image/image.tar"
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chart-testing
      - name: Load image into kind
        run: kind load docker-image "${IMAGE_LOCAL}" --name chart-testing
      - name: Deploy CI overlay
        run: kubectl apply -k infra/k8s/overlays/ci
      - name: Wait for the api rollout
        run: kubectl -n nyc-taxi rollout status deploy/api --timeout=180s
      - name: Port-forward the api and run the smoke test
        run: |
          kubectl -n nyc-taxi port-forward svc/api 8080:8000 >"${RUNNER_TEMP}/port-forward.log" 2>&1 &
          scripts/smoke_test.sh http://localhost:8080
      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl -n nyc-taxi get pods -o wide || true
          kubectl -n nyc-taxi logs deploy/api --tail=200 || true
          cat "${RUNNER_TEMP}/port-forward.log" || true
